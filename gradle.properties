# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# ==========================================================
# JVM & Memory — tuned for 7GB RAM machine
# Machine: i5-1035G1, 8 cores, 7GB RAM
# Budget: Windows ~2GB + Android Studio ~1.5GB + Gradle ~1.2GB = ~4.7GB
# ==========================================================
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=768m -XX:+UseSerialGC -XX:ActiveProcessorCount=2 -Dfile.encoding=UTF-8

# Only 1 worker — prevents spawning multiple sub-processes
org.gradle.workers.max=1

# Keep daemon alive between builds (faster re-runs)
org.gradle.daemon=true

# Single-module project — no benefit from parallel
org.gradle.parallel=false

# Build cache for incremental builds
org.gradle.caching=true

# Kotlin compiler runs INSIDE Gradle JVM — no separate daemon process
# This eliminates Connection Refused / socket reset errors entirely
kotlin.compiler.execution.strategy=in-process

# Incremental Kotlin compilation
kotlin.incremental=true

# ==========================================================
# Android Settings
# ==========================================================
android.useAndroidX=true

# Jetifier is NOT needed — project uses only AndroidX libraries
android.enableJetifier=false

# Kotlin code style
kotlin.code.style=official

# Namespaced R classes
android.nonTransitiveRClass=true